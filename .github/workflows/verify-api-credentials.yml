name: Verify API credentials (read-only)

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to check (read-only)
        required: true
        default: cloudflare
        type: choice
        options:
          - cloudflare
          - spaceship
          - both

permissions: {}

jobs:
  cloudflare:
    if: ${{ inputs.provider == 'cloudflare' || inputs.provider == 'both' }}
    name: Cloudflare token and read visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Cloudflare without changing resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: python {0}
        run: |
          import http.client
          import json
          import os
          import sys

          def report(message):
              print(message, flush=True)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                  out.write(message + "\n\n")

          def get_json(label, path, token):
              connection = http.client.HTTPSConnection("api.cloudflare.com", timeout=30)
              try:
                  connection.request("GET", path, headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/json",
                  })
                  response = connection.getresponse()
                  status = response.status
                  report(label + ": HTTP " + str(status))
                  if 300 <= status < 400:
                      report(label + ": FAIL redirect_rejected")
                      return None
                  body = response.read(1048577)
                  if len(body) > 1048576:
                      report(label + ": FAIL response_size_limit")
                      return None
                  data = json.loads(body)
                  if not isinstance(data, dict):
                      report(label + ": FAIL invalid_response_shape")
                      return None
                  errors = data.get("errors")
                  if isinstance(errors, list):
                      codes = [e.get("code") for e in errors if isinstance(e, dict)]
                      codes = [c for c in codes if type(c) is int and 0 <= c <= 99999999]
                      if codes:
                          report(label + ": error_codes=" + ",".join(map(str, codes[:20])))
                  if status != 200 or data.get("success") is not True:
                      report(label + ": FAIL http_or_api_error")
                      return None
                  return data
              except Exception:
                  report(label + ": FAIL network_or_response_error")
                  return None
              finally:
                  connection.close()

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          if not token or not token.isascii() or any(c.isspace() for c in token):
              report("Cloudflare: FAIL missing_or_invalid_secret")
              sys.exit(1)

          data = get_json("Cloudflare token verify", "/client/v4/user/tokens/verify", token)
          result = data.get("result") if data is not None else None
          raw_status = result.get("status") if isinstance(result, dict) else None
          status = raw_status if raw_status in ("active", "disabled", "expired") else "unknown"
          report("Cloudflare token status: " + status)
          if data is None or status != "active":
              report("Cloudflare authentication: FAIL")
              sys.exit(1)
          report("Cloudflare authentication: PASS")

          # These optional read probes do not prove any write or deployment permissions.
          for label, path in (
              ("Cloudflare accounts", "/client/v4/accounts?page=1&per_page=50"),
              ("Cloudflare zones", "/client/v4/zones?page=1&per_page=50"),
          ):
              data = get_json(label, path, token)
              items = data.get("result") if data is not None else None
              if not isinstance(items, list):
                  report(label + ": optional_visibility_check=UNAVAILABLE")
                  continue
              info = data.get("result_info")
              total = info.get("total_count") if isinstance(info, dict) else None
              total = total if type(total) is int and total >= 0 else None
              truncated = str(total > len(items)).lower() if total is not None else "unknown"
              report(label + ": read=PASS returned=" + str(len(items))
                     + " total=" + (str(total) if total is not None else "unknown")
                     + " truncated=" + truncated + " page=1 per_page=50")
          report("Cloudflare scope: token validity plus optional first-page read visibility only; writes, DNS changes and deployments were NOT tested.")

  spaceship:
    if: ${{ inputs.provider == 'spaceship' || inputs.provider == 'both' }}
    name: Spaceship authentication and domain read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Spaceship without changing domains
        env:
          SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
          SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
        shell: python {0}
        run: |
          import http.client
          import json
          import os
          import sys

          def report(message):
              print(message, flush=True)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                  out.write(message + "\n\n")

          key = os.environ.get("SPACESHIP_API_KEY", "")
          secret = os.environ.get("SPACESHIP_API_SECRET", "")
          if any(not value or not value.isascii() or any(c.isspace() for c in value)
                 for value in (key, secret)):
              report("Spaceship: FAIL missing_or_invalid_secret")
              sys.exit(1)

          connection = http.client.HTTPSConnection("spaceship.dev", timeout=30)
          try:
              connection.request("GET", "/api/v1/domains?take=100&skip=0", headers={
                  "X-API-Key": key,
                  "X-API-Secret": secret,
                  "Accept": "application/json",
              })
              response = connection.getresponse()
              status = response.status
              report("Spaceship domains: HTTP " + str(status))
              if 300 <= status < 400:
                  report("Spaceship: FAIL redirect_rejected")
                  sys.exit(1)
              if status != 200:
                  # Do not print the provider's arbitrary error detail/message.
                  report("Spaceship: FAIL http_error_" + str(status))
                  sys.exit(1)
              body = response.read(1048577)
              if len(body) > 1048576:
                  report("Spaceship: FAIL response_size_limit")
                  sys.exit(1)
              data = json.loads(body)
              if not isinstance(data, dict) or not isinstance(data.get("items"), list):
                  report("Spaceship: FAIL invalid_response_shape")
                  sys.exit(1)
              count = len(data["items"])
              total = data.get("total")
              total = total if type(total) is int and total >= 0 else None
              truncated = str(total > count).lower() if total is not None else "unknown"
              report("Spaceship authentication and domains:read: PASS")
              report("Spaceship domains: returned=" + str(count)
                     + " total=" + (str(total) if total is not None else "unknown")
                     + " truncated=" + truncated + " skip=0 take=100")
              report("Spaceship domain visibility: " + ("nonempty" if count else "empty; authentication succeeded but no domains returned"))
              report("Spaceship scope: first-page domain read only; nameserver writes and all other changes were NOT tested. GSC was NOT tested.")
          except Exception:
              report("Spaceship: FAIL network_or_response_error")
              sys.exit(1)
          finally:
              connection.close()
